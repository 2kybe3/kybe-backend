name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  LOCAL_TAG: kybe-backend:latest
  REMOTE_TAG: reg.kybe.xyz/kybe-pub/kybe-backend
  REGISTRY_URL: reg.kybe.xyz
  TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build, Push & Deploy Backend
    runs-on: self-hosted
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:beea02d9454a21c06de0104bb1f8c1542b88dd88f33022f9d36b52b48e022bd7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://git.kybe.xyz/2kybe3/ci/actions/nix-setup@main
      - uses: https://git.kybe.xyz/2kybe3/ci/actions/attic-setup@main
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build image
        run: nix build .#image -L -v --no-update-lock-file

      - name: Load image
        run: docker load < ./result

      - name: Tag Docker image
        run: docker tag ${{ env.LOCAL_TAG }} ${{ env.REMOTE_TAG }}

      - name: Log in to private registry
        uses: https://github.com/docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Push image
        run: docker push ${{ env.REMOTE_TAG }}

      - name: Copy docker-compose.yml to server
        uses: https://github.com/appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.RUNNER_SSH_KEY }}
          overwrite: true
          source: "docker-compose.yml"
          target: "/opt/backend/"

      - name: Deploy to production server
        uses: https://github.com/appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.RUNNER_SSH_KEY }}
          script: |
            echo "${{ secrets.REGISTRY_PASS }}" | docker login ${{ env.REGISTRY_URL }} -u "${{ vars.REGISTRY_USER }}" --password-stdin

            cd /opt/backend
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
          envs: REGISTRY_URL,REGISTRY_USER

      - uses: https://git.kybe.xyz/2kybe3/ci/actions/attic-push@main
